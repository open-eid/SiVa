suite: helm test pod
templates:
  - tests/test-connection.yaml
tests:
  - it: renders the test hook against the management service by default
    asserts:
      - isKind:
          of: Pod
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test
      - contains:
          path: spec.containers[0].args
          content: http://RELEASE-NAME-siva-webapp-management:8081/monitoring/health
  - it: targets the traffic service and service.port without the split
    set:
      service:
        port: 80
      runtime:
        managementPort: 8080
    asserts:
      - contains:
          path: spec.containers[0].args
          content: http://RELEASE-NAME-siva-webapp:80/monitoring/health
  - it: can be switched off
    set:
      tests:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
