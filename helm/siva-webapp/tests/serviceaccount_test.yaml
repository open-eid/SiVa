suite: serviceaccount
templates:
  - serviceaccount.yaml
  - deployment.yaml
  - cronjob-tsl-fetch.yaml
  - configmap.yaml
tests:
  - it: creates a ServiceAccount without token automount by default
    template: serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-siva-webapp
      - equal:
          path: automountServiceAccountToken
          value: false
  - it: automount follows security.automountServiceAccountToken on the account
    template: serviceaccount.yaml
    set:
      security:
        automountServiceAccountToken: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true
  - it: takes a custom name and annotations when created
    set:
      serviceAccount:
        name: siva-runtime
        annotations:
          example.invalid/role: siva
    asserts:
      - equal:
          path: metadata.name
          value: siva-runtime
        template: serviceaccount.yaml
      - equal:
          path: metadata.annotations["example.invalid/role"]
          value: siva
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: siva-runtime
        template: deployment.yaml
  - it: the Deployment uses the created account
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-siva-webapp
  - it: can use an existing account instead
    set:
      serviceAccount:
        create: false
        name: existing-sa
    asserts:
      - hasDocuments:
          count: 0
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-sa
        template: deployment.yaml
  - it: falls back to default when not created and unnamed
    set:
      serviceAccount:
        create: false
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default

  - it: gives the fetcher pods their own ServiceAccount in snapshot mode
    set:
      tsl:
        mode: snapshot
        snapshot:
          persistentVolumeClaim:
            create: true
        fetcher:
          serviceAccount:
            annotations:
              example.invalid/role: tsl-store-writer
    asserts:
      - hasDocuments:
          count: 2
        template: serviceaccount.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-siva-webapp-tsl-fetch
        documentIndex: 1
        template: serviceaccount.yaml
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: tsl-fetch
        documentIndex: 1
        template: serviceaccount.yaml
      - equal:
          path: metadata.annotations["example.invalid/role"]
          value: tsl-store-writer
        documentIndex: 1
        template: serviceaccount.yaml
      - equal:
          path: automountServiceAccountToken
          value: false
        documentIndex: 1
        template: serviceaccount.yaml
      - notExists:
          path: metadata.annotations
        documentIndex: 0
        template: serviceaccount.yaml
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: RELEASE-NAME-siva-webapp-tsl-fetch
        template: cronjob-tsl-fetch.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-siva-webapp
        template: deployment.yaml

  - it: creates no fetcher ServiceAccount in online mode
    template: serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: lets the fetcher use a named account, or the webapp's
    set:
      tsl:
        mode: snapshot
        snapshot:
          persistentVolumeClaim:
            create: true
        fetcher:
          serviceAccount:
            create: false
            name: store-writer
    asserts:
      - hasDocuments:
          count: 1
        template: serviceaccount.yaml
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: store-writer
        template: cronjob-tsl-fetch.yaml

  - it: falls back to the webapp's account when the fetcher creates none and names none
    template: cronjob-tsl-fetch.yaml
    set:
      tsl:
        mode: snapshot
        snapshot:
          persistentVolumeClaim:
            create: true
        fetcher:
          serviceAccount:
            create: false
      serviceAccount:
        name: siva-runtime
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: siva-runtime
