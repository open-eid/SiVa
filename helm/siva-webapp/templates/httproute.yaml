{{- $root := . -}}
{{- $fullname := include "siva-webapp.fullname" . -}}
{{- $port := .Values.service.port -}}
{{- $edgeTimeout := include "siva-webapp.edgeTimeoutSeconds" . -}}
{{- range .Values.network.httpRoutes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-%s" $fullname .name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- /* The chart's labels win over an entry's: a duplicate key would otherwise break the render. */}}
    {{- merge (include "siva-webapp.labels" $root | fromYaml) (.labels | default dict) | toYaml | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .parentRefs }}
    - name: {{ .name }}
      {{- with .namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . }}
      {{- end }}
      {{- with .port }}
      port: {{ . }}
      {{- end }}
    {{- end }}
  {{- with .hostnames }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        {{- range (.paths | default (list (dict "path" "/"))) }}
        - path:
            type: {{ .type | default "PathPrefix" }}
            value: {{ .path }}
        {{- end }}
      backendRefs:
        - name: {{ $fullname }}
          port: {{ $port }}
      {{- /* The edge timeout as the route's request timeout (standard channel since Gateway API v1.1; a v1.0
           API server prunes the field silently); the body size has no Gateway API field. */}}
      timeouts:
        request: {{ $edgeTimeout }}s
{{- end }}
