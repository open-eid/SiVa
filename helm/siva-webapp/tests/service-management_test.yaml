suite: management service
templates:
  - service-management.yaml
tests:
  - it: exposes the management port in-cluster by default, never as NodePort
    set:
      service:
        type: NodePort
        nodePort: 30080
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-siva-webapp-management
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0]
          value:
            name: management
            port: 8081
            targetPort: management
            protocol: TCP
      - isSubset:
          path: spec.selector
          content:
            app.kubernetes.io/name: siva-webapp
            app.kubernetes.io/instance: RELEASE-NAME
  - it: follows runtime.managementPort
    set:
      runtime:
        managementPort: 9001
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 9001
  - it: is not rendered without the split
    set:
      runtime:
        managementPort: 8080
    asserts:
      - hasDocuments:
          count: 0
