{{- if .Values.monitoring.grafanaDashboard.enabled }}
# Picked up by the Grafana sidecar (kube-prometheus-stack) through the label below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "siva-webapp.fullname" . }}-grafana-dashboard
  {{- with .Values.monitoring.grafanaDashboard.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "siva-webapp.labels" . | nindent 4 }}
    {{- with .Values.monitoring.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.monitoring.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  siva-webapp.json: |-
    {{- .Files.Get "dashboards/siva-webapp.json" | nindent 4 }}
{{- end }}
