suite: deployment
templates:
  - deployment.yaml
  - configmap.yaml   # referenced by the checksum annotation
chart:
  appVersion: 9.9.9   # the tests check the "tag defaults to appVersion" logic, not the real release
tests:
  - it: renders one Deployment with the chart defaults
    template: deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-siva-webapp
      - equal:
          path: spec.replicas
          value: 1
      - isSubset:
          path: spec.selector.matchLabels
          content:
            app.kubernetes.io/name: siva-webapp
            app.kubernetes.io/instance: RELEASE-NAME

  - it: image defaults to repository:appVersion with IfNotPresent
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: siva-webapp:9.9.9
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: image tag, pull policy and pull secrets come from values
    template: deployment.yaml
    set:
      image:
        repository: registry.example.invalid/siva-webapp
        tag: v1
        pullPolicy: Always
        pullSecrets:
          - name: regcred
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.invalid/siva-webapp:v1
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: regcred

  - it: probes hit the actuator health groups on the http port
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /monitoring/health/liveness
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /monitoring/health/readiness
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /monitoring/health/liveness
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 60

  - it: probe paths and timings are overridable per probe
    template: deployment.yaml
    set:
      probes:
        readiness:
          path: /custom/ready
        liveness:
          periodSeconds: 7
          failureThreshold: 9
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /custom/ready
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 7
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 9
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /monitoring/health/liveness

  - it: the container port follows service.containerPort, independently of service.port
    template: deployment.yaml
    set:
      service:
        port: 80
        containerPort: 9090
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0]
          value:
            name: http
            containerPort: 9090
            protocol: TCP

  - it: disabled probes are omitted
    template: deployment.yaml
    set:
      probes:
        startup: {enabled: false}
        readiness: {enabled: false}
        liveness: {enabled: false}
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe

  - it: mounts the ConfigMap and points Spring at it
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_CONFIG_ADDITIONAL_LOCATION
            value: file:/etc/siva-webapp/application.yml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /etc/siva-webapp
            readOnly: true
      - equal:
          path: spec.template.spec.volumes[?(@.name == "config")].configMap.name
          value: RELEASE-NAME-siva-webapp
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[a-f0-9]{64}$   # sha256 of the rendered ConfigMap (change-on-edit is not testable here)

  - it: config mount path moves the mount and the Spring location together
    template: deployment.yaml
    set:
      config:
        mountPath: /config
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_CONFIG_ADDITIONAL_LOCATION
            value: file:/config/application.yml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /config
            readOnly: true

  - it: passes extra env through as plain EnvVar entries, dotted names and valueFrom included
    template: deployment.yaml
    set:
      env:
        - name: SPRING_PROFILES_ACTIVE
          value: test
        - name: t-level-signature-filter.countries
          value: EE
        - name: SIVA_SIGNATURESERVICE_PKCS12_PASSWORD
          valueFrom:
            secretKeyRef:
              name: siva-signing
              key: password
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: SPRING_CONFIG_ADDITIONAL_LOCATION
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 4
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_PROFILES_ACTIVE
            value: test
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: t-level-signature-filter.countries
            value: EE
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIVA_SIGNATURESERVICE_PKCS12_PASSWORD
            valueFrom:
              secretKeyRef:
                name: siva-signing
                key: password

  - it: the kind overlay sets the test profile, compose-parity env and a re-pulled image
    template: deployment.yaml
    values:
      - ../values-kind.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^[^:]+(:[0-9]+)?/siva-webapp:[A-Za-z0-9._-]+$
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 5
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPRING_PROFILES_ACTIVE
            value: test
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TZ
            value: Europe/Tallinn
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: t-level-signature-filter.filter-type
            value: NOT_ALLOWED_COUNTRIES
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: t-level-signature-filter.countries
            value: EE

  - it: envFrom is only rendered with an existing secret
    template: deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: envFrom references the existing secret when set
    template: deployment.yaml
    set:
      envFrom:
        existingSecret: siva-env
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: siva-env

  - it: token automount can be switched on for the pod
    template: deployment.yaml
    set:
      security:
        automountServiceAccountToken: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: security contexts and token automount follow values
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60

  - it: resources and /tmp emptyDir are present by default
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}

  - it: scheduling knobs, pod annotations and labels are only rendered when set
    template: deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.tolerations
      - notExists:
          path: spec.template.spec.affinity
      - notExists:
          path: spec.template.metadata.labels["example.invalid/label"]
      - notExists:
          path: spec.template.metadata.annotations["example.invalid/annotation"]

  - it: the all-on lint overlay renders every scheduling knob, pod annotation and label
    template: deployment.yaml
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/os"]
          value: linux
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: example.invalid/taint
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
      - equal:
          path: spec.template.metadata.labels["example.invalid/label"]
          value: "yes"
      - equal:
          path: spec.template.metadata.annotations["example.invalid/annotation"]
          value: "yes"
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: example-registry-credentials
      - equal:
          path: spec.replicas
          value: 2
