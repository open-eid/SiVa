suite: serviceaccount
templates:
  - serviceaccount.yaml
  - deployment.yaml
  - configmap.yaml
tests:
  - it: creates a ServiceAccount without token automount by default
    template: serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-siva-webapp
      - equal:
          path: automountServiceAccountToken
          value: false
  - it: automount follows security.automountServiceAccountToken on the account
    template: serviceaccount.yaml
    set:
      security:
        automountServiceAccountToken: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true
  - it: takes a custom name and annotations when created
    set:
      serviceAccount:
        name: siva-runtime
        annotations:
          example.invalid/role: siva
    asserts:
      - equal:
          path: metadata.name
          value: siva-runtime
        template: serviceaccount.yaml
      - equal:
          path: metadata.annotations["example.invalid/role"]
          value: siva
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: siva-runtime
        template: deployment.yaml
  - it: the Deployment uses the created account
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-siva-webapp
  - it: can use an existing account instead
    set:
      serviceAccount:
        create: false
        name: existing-sa
    asserts:
      - hasDocuments:
          count: 0
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-sa
        template: deployment.yaml
  - it: falls back to default when not created and unnamed
    set:
      serviceAccount:
        create: false
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default
