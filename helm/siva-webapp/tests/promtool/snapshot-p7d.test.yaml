# promtool threshold tests for snapshot-p7d.values.yaml. Snapshot mode, period P7D (the longest allowed). Stale 2P + grace (PT1H) = 14 d 1 h, warning
# 2P + lead time (P7D) = 21 d, critical P + 1 d = 8 d.
# Minutes below are those thresholds written out, not recomputed from the chart. Rules are
# evaluated every 10 minutes (14 days at 1m take a minute); each boundary is probed 10 minutes either side.
rule_files:
  - rules.yaml
evaluation_interval: 10m

tests:
  # EE's list and the LOTL both have NextUpdate at 30300m: warning from 30240m before it (after 60m),
  # critical from 11520m before it (after 18780m), each alert per list.
  - interval: 1m
    input_series:
      - series: 'siva_tsl_next_update_timestamp_seconds{namespace="siva",pod="siva-webapp-7d9f8b6c4-x2k9p",loader="generic",kind="tl",territory="EE"}'
        values: '1818000x18790'
      - series: 'siva_tsl_next_update_timestamp_seconds{namespace="siva",pod="siva-webapp-7d9f8b6c4-x2k9p",loader="generic",kind="lotl",territory="EU"}'
        values: '1818000x18790'
    alert_rule_test:
      - eval_time: 50m
        alertname: SivaTslListExpiringSoon
        exp_alerts: []
      - eval_time: 70m
        alertname: SivaTslListExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: siva
              pod: siva-webapp-7d9f8b6c4-x2k9p
              loader: generic
              kind: tl
              territory: EE
            exp_annotations:
              summary: "The EE trusted list (tl) runs out within 21 d"
              description: "Its NextUpdate is close and SiVa has not received a newer version. Once it passes, signatures relying on it lose qualification (POLv4 fails them) and, at the next reload, their trust anchors."
          - exp_labels:
              severity: warning
              namespace: siva
              pod: siva-webapp-7d9f8b6c4-x2k9p
              loader: generic
              kind: lotl
              territory: EU
            exp_annotations:
              summary: "The EU trusted list (lotl) runs out within 21 d"
              description: "Its NextUpdate is close and SiVa has not received a newer version. Once it passes, signatures relying on it lose qualification (POLv4 fails them) and, at the next reload, their trust anchors."
      - eval_time: 70m
        alertname: SivaTslListExpiring
        exp_alerts: []
      - eval_time: 18770m
        alertname: SivaTslListExpiring
        exp_alerts: []
      - eval_time: 18790m
        alertname: SivaTslListExpiring
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: siva
              pod: siva-webapp-7d9f8b6c4-x2k9p
              loader: generic
              kind: tl
              territory: EE
            exp_annotations:
              summary: "The EE trusted list (tl) runs out within 8 d"
              description: "Less than one refresh period plus a day is left. Check that the publisher has issued a newer list and that the refresh picks it up."
          - exp_labels:
              severity: critical
              namespace: siva
              pod: siva-webapp-7d9f8b6c4-x2k9p
              loader: generic
              kind: lotl
              territory: EU
            exp_annotations:
              summary: "The EU trusted list (lotl) runs out within 8 d"
              description: "Less than one refresh period plus a day is left. Check that the publisher has issued a newer list and that the refresh picks it up."

  # The pod's snapshot is renewed at 10080m (one period), then frozen: stale only after 30300m, not at
  # 20220m. Another namespace's snapshot, frozen at 0, never fires.
  - interval: 1m
    input_series:
      - series: 'siva_tsl_snapshot_created_timestamp_seconds{namespace="siva",pod="siva-webapp-7d9f8b6c4-x2k9p",loader="generic"}'
        values: '0x10079 604800x20230'
      - series: 'siva_tsl_snapshot_created_timestamp_seconds{namespace="other",pod="siva-webapp-7d9f8b6c4-x2k9p",loader="generic"}'
        values: '0x30310'
    alert_rule_test:
      - eval_time: 20230m
        alertname: SivaTslSnapshotStale
        exp_alerts: []
      - eval_time: 30290m
        alertname: SivaTslSnapshotStale
        exp_alerts: []
      - eval_time: 30310m
        alertname: SivaTslSnapshotStale
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: siva
              pod: siva-webapp-7d9f8b6c4-x2k9p
              loader: generic
            exp_annotations:
              summary: "SiVa pod siva-webapp-7d9f8b6c4-x2k9p runs on a snapshot older than 14 d 1 h"
              description: "Two fetch periods without a newer snapshot reaching the pod: the fetch, a sync between store and pod, or the pod's refusal of a newer snapshot (see its log)."

  # The fetch CronJob last succeeded at 10080m, then fails: alert after 30300m. CronJobs of another
  # name or namespace keep succeeding; were the selector to take them in, max() would hide the failure.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="siva",cronjob="siva-webapp-tsl-fetch"}'
        values: '0x10079 604800x20230'
      - series: 'kube_cronjob_status_last_successful_time{namespace="siva",cronjob="siva-webapp-canary-tsl-fetch"}'
        values: '0+60x30310'
      - series: 'kube_cronjob_status_last_successful_time{namespace="other",cronjob="siva-webapp-tsl-fetch"}'
        values: '0+60x30310'
    alert_rule_test:
      - eval_time: 20230m
        alertname: SivaTslFetchFailing
        exp_alerts: []
      - eval_time: 30290m
        alertname: SivaTslFetchFailing
        exp_alerts: []
      - eval_time: 30310m
        alertname: SivaTslFetchFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "SiVa trust-list fetch has not succeeded for 14 d 1 h"
              description: "The pods keep validating on the last published snapshot; its lists expire one by one. Check the fetch Job's logs: kubectl -n siva logs job/<newest siva-webapp-tsl-fetch-...>."
