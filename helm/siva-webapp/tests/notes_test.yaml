suite: install notes
templates:
  - NOTES.txt
tests:
  - it: says that the forwarded headers are taken from whoever reaches the pod while no policy limits that
    asserts:
      - matchRegexRaw:
          pattern: 'runtime.forwardHeadersStrategy is "framework" and no NetworkPolicy limits who reaches'
      - matchRegexRaw:
          pattern: 'image.repository is the bare default'

  - it: is quiet about forwarded headers once the policy admits only the named peers
    set:
      network:
        networkPolicy:
          enabled: true
          ingressFrom:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ingress-nginx
    asserts:
      - notMatchRegexRaw:
          pattern: forwardHeadersStrategy

  - it: still says so with the policy on but ingressFrom empty, which admits any source
    set:
      network:
        networkPolicy:
          enabled: true
    asserts:
      - matchRegexRaw:
          pattern: no NetworkPolicy limits who reaches

  - it: is quiet about forwarded headers under the native and none strategies
    set:
      runtime:
        forwardHeadersStrategy: native
    asserts:
      - notMatchRegexRaw:
          pattern: forwardHeadersStrategy

  - it: is quiet about the image once the repository names a registry
    set:
      image:
        repository: registry.example.invalid/siva-webapp
    asserts:
      - notMatchRegexRaw:
          pattern: bare default

  - it: names the two edge numbers, the timeout following runtime.shutdownTimeout
    asserts:
      - matchRegexRaw:
          pattern: 'must accept\nrequest bodies of 27 MiB and wait 30 s for an answer'

  - it: names the edge timeout set in network.edge
    set:
      network:
        edge:
          maxBodyMiB: 28
          timeoutSeconds: 120
    asserts:
      - matchRegexRaw:
          pattern: 'request bodies of 28 MiB and wait 120 s for an answer'

  - it: prints an Exact route path as it is and appends /validate to a prefix
    set:
      network:
        httpRoutes:
          - name: exact
            parentRefs:
              - name: g
            paths:
              - path: /validate
                type: Exact
          - name: prefix
            parentRefs:
              - name: g
            paths:
              - path: /api/
          - name: bare
            parentRefs:
              - name: g
    asserts:
      - matchRegexRaw:
          pattern: 'HTTPRoute RELEASE-NAME-siva-webapp-exact on Gateway g: POST <gateway address>/validate\n'
      - matchRegexRaw:
          pattern: 'HTTPRoute RELEASE-NAME-siva-webapp-prefix on Gateway g: POST <gateway address>/api/validate\n'
      - matchRegexRaw:
          pattern: 'HTTPRoute RELEASE-NAME-siva-webapp-bare on Gateway g: POST <gateway address>/validate\n'
      - notMatchRegexRaw:
          pattern: '/validate/validate'
