{{- if .Values.monitoring.prometheusRule.enabled }}
{{- $name := include "siva-webapp.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- /* Deployment pods are <fullname>-<replicaset hash>-<pod hash>. A dot in the name must reach
       the regex as \. and PromQL's double-quoted string needs that backslash doubled. */ -}}
{{- $pods := printf "%s-[a-z0-9]+-[a-z0-9]+" ($name | replace "." "\\\\.") }}
{{- $app := printf `namespace="%s",pod=~"%s",uri!~"/monitoring.*"` $ns $pods }}
{{- $kube := printf `namespace="%s",pod=~"%s"` $ns $pods }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $name }}
  {{- with .Values.monitoring.prometheusRule.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "siva-webapp.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ $name }}
      rules:
        # Spring Boot's http_server_requests metrics (scraped through the ServiceMonitor; the
        # actuator's own requests are excluded by uri) and kube-state-metrics pod metrics. Pod
        # readiness and crash loops are left to the cluster's own rules (kube-prometheus-stack's
        # KubePodNotReady and KubePodCrashLooping); an OOM kill shows there only as a crash loop.
        - alert: SivaValidationErrorRate
          expr: >-
            sum(rate(http_server_requests_seconds_count{{ "{" }}{{ $app }},status=~"5.."}[10m]))
              / sum(rate(http_server_requests_seconds_count{{ "{" }}{{ $app }}}[10m])) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "SiVa 5xx ratio above 5 % for 10 minutes"
            description: "More than 5 % of API requests fail with a 5xx; check the pod logs."
        - alert: SivaOomKilled
          expr: >-
            kube_pod_container_status_last_terminated_reason{{ "{" }}{{ $kube }},reason="OOMKilled"} == 1
              and on (namespace, pod, container) increase(kube_pod_container_status_restarts_total{{ "{" }}{{ $kube }}}[30m]) > 0
          labels:
            severity: critical
          annotations:
            summary: "SiVa pod {{ "{{ $labels.pod }}" }} was OOM-killed in the last 30 minutes"
            description: "Raise resources.limits.memory (Paketo sizes the heap from it) or lower the thread count."
        {{- $stale := include "siva-webapp.tslAlertSeconds" (list $ "stale") }}
        {{- $expiryWarning := include "siva-webapp.tslAlertSeconds" (list $ "expiryWarning") }}
        {{- $expiryCritical := include "siva-webapp.tslAlertSeconds" (list $ "expiryCritical") }}
        # SiVa's trust-list gauges: one series per configured territory (trusted and mandatory, as
        # SiVa itself resolved them), so these rules repeat no country list. Thresholds derive from
        # the refresh period: tsl.fetcher.period in snapshot mode, one day online (ADR 0004).
        - alert: SivaTslMandatoryTerritoryNotValidating
          expr: siva_tsl_trust_anchors{{ "{" }}{{ $kube }},mandatory="true"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "SiVa holds no trust anchors for mandatory territory {{ "{{ $labels.territory }}" }} ({{ "{{ $labels.loader }}" }} loader)"
            description: "Signatures from {{ "{{ $labels.territory }}" }} cannot be validated as trusted and the pod is not ready. Its list is missing, expired or badly signed: check the tsl health detail and, in snapshot mode, the fetch Job's log."
        - alert: SivaTslTerritoryNotValidating
          expr: siva_tsl_trust_anchors{{ "{" }}{{ $kube }},mandatory="false"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "SiVa holds no trust anchors for territory {{ "{{ $labels.territory }}" }} ({{ "{{ $labels.loader }}" }} loader)"
            description: "Signatures from {{ "{{ $labels.territory }}" }} validate as untrusted until its list loads again; other territories are unaffected."
        - alert: SivaTslListExpiringSoon
          expr: siva_tsl_next_update_timestamp_seconds{{ "{" }}{{ $kube }}} - time() < {{ $expiryWarning }}
          labels:
            severity: warning
          annotations:
            summary: "The {{ "{{ $labels.territory }}" }} trusted list ({{ "{{ $labels.kind }}" }}) runs out within {{ include "siva-webapp.humanSeconds" $expiryWarning }}"
            description: "Its NextUpdate is close and SiVa has not received a newer version. Once it passes, signatures relying on it lose qualification (POLv4 fails them) and, at the next reload, their trust anchors."
        - alert: SivaTslListExpiring
          expr: siva_tsl_next_update_timestamp_seconds{{ "{" }}{{ $kube }}} - time() < {{ $expiryCritical }}
          labels:
            severity: critical
          annotations:
            summary: "The {{ "{{ $labels.territory }}" }} trusted list ({{ "{{ $labels.kind }}" }}) runs out within {{ include "siva-webapp.humanSeconds" $expiryCritical }}"
            description: "Less than one refresh period plus a day is left. Check that the publisher has issued a newer list and that the refresh picks it up."
        {{- if include "siva-webapp.snapshotMode" . }}
        - alert: SivaTslSnapshotStale
          expr: time() - siva_tsl_snapshot_created_timestamp_seconds{{ "{" }}{{ $kube }}} > {{ $stale }}
          labels:
            severity: warning
          annotations:
            summary: "SiVa pod {{ "{{ $labels.pod }}" }} runs on a snapshot older than {{ include "siva-webapp.humanSeconds" $stale }}"
            description: "Two fetch periods without a newer snapshot reaching the pod: the fetch, a sync between store and pod, or the pod's refusal of a newer snapshot (see its log)."
        # kube-state-metrics' view of the fetch CronJob: 0 until the first success, then the
        # epoch seconds of the last one.
        - alert: SivaTslFetchFailing
          expr: >-
            time() - max(kube_cronjob_status_last_successful_time{namespace="{{ $ns }}",cronjob="{{ include "siva-webapp.fetcherName" . }}"}) > {{ $stale }}
          labels:
            severity: warning
          annotations:
            summary: "SiVa trust-list fetch has not succeeded for {{ include "siva-webapp.humanSeconds" $stale }}"
            description: "The pods keep validating on the last published snapshot; its lists expire one by one. Check the fetch Job's logs: kubectl -n {{ $ns }} logs job/<newest {{ include "siva-webapp.fetcherName" . }}-...>."
        {{- end }}
        {{- if .Values.monitoring.prometheusRule.pendingRules }}
        # Signals the application does not publish yet: oversized requests are answered 400 like
        # any other bad request (no 413, no counter), and OCSP/TSA failures have no metric. The names and expressions are the agreed ones; switch
        # pendingRules on once the application exposes them.
        - alert: SivaRequestRejectedSize
          expr: >-
            increase(http_server_requests_seconds_count{{ "{" }}{{ $app }},status="413"}[15m]) > 0
          labels:
            severity: info
          annotations:
            summary: "SiVa rejects oversized requests"
            description: "Clients send containers above the request size limit (27 MB by default)."
        - alert: SivaOcspTsaFailures
          expr: rate(siva_ocsp_tsa_failures_total{{ "{" }}{{ $kube }}}[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "OCSP or timestamp responders failing"
            description: "Revocation or timestamp checks fail; LT/LTA validations degrade."
        {{- end }}
        {{- with .Values.monitoring.prometheusRule.additionalRules }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
