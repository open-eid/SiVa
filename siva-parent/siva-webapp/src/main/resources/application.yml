management:
  health:
    diskspace:
      enabled: false
  endpoints:
    web:
      base-path: /monitoring
      exposure:
        include:
          - health
          - prometheus
          # heartbeat and version are public API (interfaces.md) and stay; with a separate management port
          # (MANAGEMENT_SERVER_PORT) the application port keeps serving them and health (TrafficPortMonitoringController).
          - heartbeat
          - version
  endpoint:
    health:
      show-details: "ALWAYS"
      probes:
        enabled: true
        # With a separate management port (MANAGEMENT_SERVER_PORT) the liveness and readiness groups
        # also answer on the traffic port as /livez and /readyz: status only, for load balancers and
        # kubelet probes. Without the split, /monitoring/health/liveness and /readiness remain the paths.
        add-additional-paths: true
      group:
        readiness:
          # A pod is ready only once its trust lists are loaded (tsl-loader's TSLHealthIndicator).
          # Status only, like the built-in probe group; the details stay on /monitoring/health.
          include: readinessState, tsl
          show-details: never
          show-components: never
    heartbeat:
      enabled: true
      cache:
        time-to-live: 10s
    version:
      enabled: true

logging:
  pattern:
    # Boot's correlation slot in the text pattern: the request id TraceIdLoggingFilter puts in the MDC, printed
    # between the thread and the logger, so one grep over the id gives a request's record. Structured output
    # (logging.structured.format.console) carries the same MDC entry as a field.
    correlation: "[%X{trace.id:-}] "

siva:
  http:
    request:
      # 20 MB + base64 overhead (ceil(20MB / 3) * 4) rounded up
      max-request-size-limit: 27MB

spring:
  autoconfigure:
    # Disable /error endpoint mapping and logging
    exclude: org.springframework.boot.webmvc.autoconfigure.error.ErrorMvcAutoConfiguration
  servlet:
    encoding:
      # Force the encoding to the configured charset on HTTP requests and responses.
      force: true
  web:
    error:
      whitelabel:
        enabled: false
    resources:
      # Allow custom handler for NoHandlerFoundException
      add-mappings: false
