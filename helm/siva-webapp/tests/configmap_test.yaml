suite: configmap
templates:
  - configmap.yaml
tests:
  - it: renders application.yml from values
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-siva-webapp
      - matchRegex:
          path: data["application.yml"]
          pattern: "probes:\\n\\s+enabled: true"
  - it: takes an arbitrary override
    set:
      config:
        applicationYaml: |
          siva:
            tsl:
              trustedTerritories: [EE]
    asserts:
      - equal:
          path: data["application.yml"]
          value: |
            siva:
              tsl:
                trustedTerritories: [EE]
