{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "siva-webapp.serviceAccountName" . }}
  labels:
    {{- include "siva-webapp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.security.automountServiceAccountToken }}
{{- end }}
{{- if and (include "siva-webapp.snapshotMode" .) .Values.tsl.fetcher.serviceAccount.create }}
---
# The fetcher pods' own account: an annotation that binds a cloud identity for the store (the
# bucket of tsl.snapshot.sync) goes here, never on the webapp's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "siva-webapp.fetcherServiceAccountName" . }}
  labels:
    {{- include "siva-webapp.fetcherLabels" . | nindent 4 }}
  {{- with .Values.tsl.fetcher.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.security.automountServiceAccountToken }}
{{- end }}
