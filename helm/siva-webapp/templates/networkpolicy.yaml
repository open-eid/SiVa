{{- if .Values.network.networkPolicy.enabled }}
{{- /* Ingress-only: who may reach the traffic port and the management port. Egress is left
       open on purpose: the app fetches ~30 trust lists, OCSP and TSA responders over HTTPS, a
       host set that changes with the lists; restrict it in your own policy if you can. */ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "siva-webapp.fullname" . }}
  labels:
    {{- include "siva-webapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "siva-webapp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.network.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if include "siva-webapp.managementSplit" . }}
    - ports:
        - port: management
          protocol: TCP
      {{- with .Values.network.networkPolicy.managementFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
